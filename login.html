<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institution Login | Grades Education</title>
    <meta name="description" content="Secure login for partner institutions.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><img src="assets/logo-grades.svg" alt="Grades Education" class="site-logo"></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="why-choose-us.html">Not a grading tool</a>
                <a href="tools.html">Tools</a>
                <a href="compliance.html">Compliance</a>
                <a href="philosophy.html">Philosophy</a>
                <a href="team.html">Team</a>
                <a href="contact.html" class="btn-primary">Contact Us</a>
            </nav>
            <button class="mobile-menu-btn" aria-label="Toggle Navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
        <div class="card" style="width: 100%; max-width: 400px; padding: 3rem;">
            <div class="section-header" style="margin-bottom: 2rem;">
                <h2>Login</h2>
                <p>Institution Access</p>
            </div>

            <form>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@university.edu" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; font-size: 0.9rem;">
                    <label style="display: flex; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" style="width: auto;"> Remember me
                    </label>
                    <a href="#" style="color: var(--text-heading); opacity: 0.8;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-primary full-width">Sign In</button>
            </form>
            <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; opacity: 0.8;">
                Don't have an account? <a href="contact.html"
                    style="font-weight: 700; text-decoration: underline;">Contact us</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div class="copyright">
                &copy; <span id="year"></span> Grades Education. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
