<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Grades Education</title>
    <meta name="description"
        content="Contact Grades Education for institutional consultation, implementation planning, and general inquiries.">
    <link rel="stylesheet" href="style.css?v=20260410-fix2">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><img src="assets/logo-grades.svg" alt="Grades Education" class="site-logo"></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="why-choose-us.html">Why us</a>
                <a href="tools.html">Our Solutions</a>
                <a href="compliance.html">Compliance</a>
                <a href="philosophy.html">Philosophy</a>
                <a href="team.html">Team</a>
                <a href="contact.html" class="btn-primary active">Contact Us</a>
            </nav>
            <button class="mobile-menu-btn" aria-label="Toggle Navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="contact-container">
            <div class="contact-info">
                <h2>Contact us</h2>
                <p>If your university or college is considering Grades Education, we can support your review process
                    and implementation planning.</p>
            </div>
            <form class="contact-form" id="contact-form" action="/webhook/contact-us-main"
                method="POST">
                <input type="text" name="_honey" tabindex="-1" autocomplete="off"
                    style="position:absolute;left:-5000px;opacity:0;pointer-events:none;">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="institution">Institution / Organization</label>
                    <input type="text" id="institution" name="institution" placeholder="University or Company Name"
                        required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your Work Email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Subject" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"
                        placeholder="Describe your institution's priorities and timeline." required></textarea>
                </div>
                <button type="submit" class="btn-primary full-width">Submit Inquiry</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div class="copyright">
                &copy; <span id="year"></span> Grades Education. All rights reserved.
            </div>
            <div class="social-links" style="display: none;">
                <a href="#">LinkedIn</a>
                <a href="#">Twitter</a>
                <a href="#">Scholar</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        const contactForm = document.getElementById('contact-form');
        if (contactForm) {
            contactForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const btn = contactForm.querySelector('button[type="submit"]');
                const originalText = btn ? btn.textContent : 'Submit Inquiry';
                if (btn) {
                    btn.textContent = 'Sending...';
                    btn.disabled = true;
                }

                const formData = new FormData(contactForm);

                try {
                    const response = await fetch(contactForm.action, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    alert('Your inquiry has been sent successfully.');
                    contactForm.reset();
                } catch (error) {
                    alert('Submission error. Please try again in a few moments.');
                    console.error('Contact form submission failed:', error);
                } finally {
                    if (btn) {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }
                }
            });
        }
    </script>
</body>

</html>
