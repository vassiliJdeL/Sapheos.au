<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Grades Education</title>
    <meta name="description"
        content="Contact Grades Education for institutional consultation, implementation planning, and general inquiries.">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Grades <span class="highlight">Education</span></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="philosophy.html">Philosophy</a>
                <a href="tools.html">Tools</a>
                <a href="compliance.html">Compliance</a>
                <a href="team.html">Team</a>
                <a href="contact.html" class="btn-primary active">Contact Us</a>
                <a href="login.html">Login</a>
            </nav>
            <button class="mobile-menu-btn" aria-label="Toggle Navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="contact-container">
            <div class="contact-info">
                <h2>Contact us</h2>
                <p>If your university or college is considering Grades Education, we can support your review process
                    and implementation planning.</p>
            </div>
            <form class="contact-form" action="https://formsubmit.co/vassili.joannides-de-lautour@grades-education.eu"
                method="POST">
                <input type="hidden" name="_subject" value="New contact inquiry from US website">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="false">
                <input type="text" name="_honey" style="display:none">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="institution">Institution / Organization</label>
                    <input type="text" id="institution" name="institution" placeholder="University or Company Name"
                        required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your Work Email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Subject" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"
                        placeholder="Describe your institution's priorities and timeline." required></textarea>
                </div>
                <button type="submit" class="btn-primary full-width">Submit Inquiry</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div class="footer-logo">Grades Education</div>
            <div class="copyright">
                &copy; <span id="year"></span> Grades Education. All rights reserved.
            </div>
            <div class="social-links" style="display: none;">
                <a href="#">LinkedIn</a>
                <a href="#">Twitter</a>
                <a href="#">Scholar</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
